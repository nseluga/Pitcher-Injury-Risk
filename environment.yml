name: pitcher-injury-risk
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # Core scientific stack
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.11.0
  - statsmodels>=0.14.0
  - pyarrow>=12.0.0

  # Machine learning
  - scikit-learn>=1.3.0
  - xgboost>=1.7.0
  - lightgbm>=4.0.0

  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - plotly>=5.15.0

  # Notebooks
  - jupyter>=1.0.0
  - jupyterlab>=4.0.0
  - ipywidgets>=8.0.0

  # Utilities
  - tqdm>=4.65.0
  - joblib>=1.3.0

  - pip:
    # Baseball data
    - pybaseball>=2.2.7

    # Survival analysis
    - lifelines>=0.27.0
    - scikit-survival>=0.21.0

    # Deep learning
    - torch>=2.0.0

    # Interpretability
    - shap>=0.42.0

    # Dashboard
    - dash>=2.11.0
    - dash-bootstrap-components>=1.4.0

    # Utilities
    - python-dotenv>=1.0.0
    - pydantic>=2.0.0
    - loguru>=0.7.0
    - requests>=2.31.0
    - beautifulsoup4>=4.12.0
    - lxml>=4.9.0
    - pingouin>=0.5.3
    - eli5>=0.13.0

    # Testing
    - pytest>=7.4.0
    - pytest-cov>=4.1.0

    # Dev
    - black>=23.0.0
    - ruff>=0.0.285
    - mypy>=1.5.0
